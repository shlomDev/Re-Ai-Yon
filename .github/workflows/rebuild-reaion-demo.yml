name: Finalize ReAion demo GIF

on:
  push:
    paths:
      - '.github/demo_gif_480/READY'

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rebuild GIF and clean staging
        shell: bash
        run: |
          set -euo pipefail
          cat .github/demo_gif_480/chunk_*.txt | base64 --decode > ReAion/docs/images/ReAion-demo.gif
          test -s ReAion/docs/images/ReAion-demo.gif
          file ReAion/docs/images/ReAion-demo.gif | grep -q 'GIF image data'
          rm -rf .github/demo_gif_480
          rm -f .github/workflows/rebuild-reaion-demo.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Replace screenshot with animated ReAion demo'
          git push
