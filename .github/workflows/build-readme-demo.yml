name: Build ReAion README demo

on:
  push:
    paths:
      - '.github/demo_gif/READY'

permissions:
  contents: write

jobs:
  build-demo:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rebuild animated README demo
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ReAion/docs/images
          cat .github/demo_gif/chunk_*.txt | base64 --decode > ReAion/docs/images/ReAion-demo.gif
          test -s ReAion/docs/images/ReAion-demo.gif
          file ReAion/docs/images/ReAion-demo.gif | grep -q 'GIF image data'
          rm -rf .github/demo_gif
          rm -f .github/workflows/build-readme-demo.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Add animated ReAion README demo'
          git push
