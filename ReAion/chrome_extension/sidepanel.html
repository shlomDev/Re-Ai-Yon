<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>ReAion</title><link rel="stylesheet" href="sidepanel.css"></head>
<body>
<button id="start">Use current meeting</button> <button id="stop">Stop listening</button>
<p id="detail" role="status"></p>
  <header><div class="logo">◈</div><div><h1>ReAion</h1><p>Live interview assistant</p></div><span id="state">CONNECTING</span></header>
  <section class="steps"><b>MEETING</b><b>→</b><b>QUESTION</b><b>→</b><b>ANSWER</b></section>
  <section><label>DETECTED QUESTION</label><div dir="auto" id="question" class="question">Waiting for the interviewer…</div></section>
  <section class="answer"><label>SUGGESTED ANSWER · TELEPROMPTER</label><div dir="auto" id="answer">The answer will appear here automatically.</div><div class="progress"><span id="page">Waiting</span><button id="next">Next line</button></div></section>
  <footer>Your microphone does not trigger new answers.</footer>
  <script src="sidepanel.js"></script>
</body></html>
